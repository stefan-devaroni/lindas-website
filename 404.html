<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Found — Linda's Dutch Pancakes</title>
<link rel="icon" type="image/png" href="/assets/logos/social-1.png">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #FAF6ED;
  color: #282204;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 2rem;
}

.logo {
  width: min(220px, 60vw);
  margin-bottom: 2rem;
}

.code {
  color: #27AAE1;
  margin-bottom: 0.5rem;
}

h1 {
  color: #5C3D1A;
  margin-bottom: 1.5rem;
}

p {
  color: #5C3D1A;
  max-width: 400px;
  margin-bottom: 2rem;
}

.btn {
  display: inline-block;
  background: #27AAE1;
  color: #fff;
  padding: 0.85rem 2.5rem;
  border-radius: 50px;
  text-decoration: none;
  transition: background 0.3s, transform 0.2s;
}

.btn:hover {
  background: #004EAD;
  transform: translateY(-2px);
}

.divider {
  width: 60px;
  height: 3px;
  background: linear-gradient(90deg, #27AAE1, #EFBD40);
  border-radius: 2px;
  margin: 1.5rem auto;
}

.footer-note {
  position: absolute;
  bottom: 2rem;
  color: #5C3D1A;
  opacity: 0.6;
}
</style>
<link rel="stylesheet" href="/assets/type.css">
</head>
<body>
  <img src="/assets/logos/logo-blue.png" alt="Linda's Dutch Pancakes" class="logo">
  <div class="code notfound-code">404</div>
  <h1 class="notfound-title">Page not found</h1>
  <div class="divider"></div>
  <p>Looks like this pancake flipped off the plate. The page you're looking for doesn't exist.</p>
  <a href="/" class="btn notfound-btn">Back to the home page</a>
  <div class="footer-note">Linda's Dutch Pancakes &middot; Palm Beach, Aruba</div>
</body>
</html>
